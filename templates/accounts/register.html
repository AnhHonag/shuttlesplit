{% load static %}
<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng ký — ShuttleSplit</title>
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head><body>
<div class="login-wrap"><div class="login-box">
  <div class="login-logo">
    <h1>🏸 <em>Shuttle</em>Split</h1>
    <p>Tạo tài khoản mới</p>
  </div>
  {% if messages %}<ul class="flash-list">{% for m in messages %}<li class="flash {{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="form-group">
      <label class="form-label">Họ và tên</label>
      <input name="full_name" class="form-control" placeholder="Nguyễn Văn A" autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">Tên đăng nhập <span style="color:var(--c-red)">*</span></label>
      <input name="username" class="form-control" placeholder="vd: nguyenvana" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input name="email" type="email" class="form-control" placeholder="email@gmail.com">
    </div>
    <div class="form-group">
      <label class="form-label">Số điện thoại</label>
      <input name="phone" class="form-control" placeholder="0901234567">
    </div>
    <div class="form-group">
      <label class="form-label">Mật khẩu <span style="color:var(--c-red)">*</span></label>
      <input name="password" type="password" class="form-control" autocomplete="new-password" required>
    </div>
    <div class="form-group">
      <label class="form-label">Xác nhận mật khẩu <span style="color:var(--c-red)">*</span></label>
      <input name="password2" type="password" class="form-control" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top:8px">Tạo tài khoản</button>
  </form>
  <div style="text-align:center;margin-top:20px;font-size:14px;color:var(--c-ink-2)">
    Đã có tài khoản? <a href="{% url 'login' %}" style="color:var(--c-green);font-weight:600">Đăng nhập</a>
  </div>
</div></div>
</body></html>
