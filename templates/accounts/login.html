{% load static %}
<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập — ShuttleSplit</title>
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head><body>
<div class="login-wrap"><div class="login-box">
  <div class="login-logo">
    <h1>🏸 <em>Shuttle</em>Split</h1>
    <p>Quản lý chi phí cầu lông nhóm bạn</p>
  </div>
  {% if messages %}<ul class="flash-list">{% for m in messages %}<li class="flash {{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="form-group"><label class="form-label">Tên đăng nhập</label>
    <input name="username" class="form-control" autocomplete="username" autofocus required></div>
    <div class="form-group"><label class="form-label">Mật khẩu</label>
    <input name="password" type="password" class="form-control" required></div>
    <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top:8px">Đăng nhập</button>
  </form>
  <div style="text-align:center;margin-top:20px;font-size:14px;color:var(--c-ink-2)">
    Chưa có tài khoản? <a href="{% url 'register' %}" style="color:var(--c-green);font-weight:600">Đăng ký ngay</a>
  </div>
</div></div>
</body></html>
